<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ustaw nowe hasło · ArtVint</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; background: #f9f8f6; color: #1c1917; font: 1rem/1.5 system-ui, sans-serif }
    main { box-sizing: border-box; max-width: 28rem; margin: 3rem auto; padding: 1.5rem; border: 1px solid #e7e5e4; border-radius: 1rem; background: white }
    h1 { margin-top: 0; font-size: 1.6rem }
    label, input { display: block }
    label { margin-top: .9rem; font-weight: 600 }
    input { box-sizing: border-box; width: 100%; padding: .65rem; margin-top: .3rem; border: 1px solid #a8a29e; border-radius: .5rem; font: inherit }
    p { color: #57534e; font-size: .9rem }
    button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: .6rem; background: #115e59; color: white; font: inherit; font-weight: 600 }
    button:disabled { opacity: .55 }
    a { color: #115e59 }
  </style>
</head>
<body>
  <main>
    <h1>Ustaw nowe hasło</h1>
    <form id="reset-form" hidden>
      <label for="new-password">Nowe hasło</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-rules">
      <p id="password-rules">Użyj co najmniej 8 znaków, wielkiej i małej litery, cyfry i znaku specjalnego.</p>
      <label for="repeat-password">Powtórz hasło</label>
      <input id="repeat-password" type="password" autocomplete="new-password" maxlength="128" required>
      <button type="submit">Zapisz hasło</button>
    </form>
    <p id="reset-status" role="status"></p>
    <a href="/">Wróć do ArtVint</a>
  </main>
  <script>
    const token = new URLSearchParams(window.location.hash.slice(1)).get('token');
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);

    const form = document.getElementById('reset-form');
    const status = document.getElementById('reset-status');
    form.hidden = !/^[a-f0-9]{64}$/.test(token || '');
    if (form.hidden) status.textContent = 'Otwórz link otrzymany w wiadomości od ArtVint.';

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      if (password !== document.getElementById('repeat-password').value) {
        status.textContent = 'Podane hasła różnią się.';
        return;
      }
      const submit = form.querySelector('button');
      submit.disabled = true;
      try {
        const response = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Nie udało się zmienić hasła.');
        form.reset();
        form.hidden = true;
        status.textContent = 'Hasło zostało zmienione. Możesz zalogować się nowym hasłem.';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
